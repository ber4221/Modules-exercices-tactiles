<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>N7 - 3</title><style>
*{box-sizing:border-box}
html,body{margin:0;background:#eef2f5;font-family:Arial,sans-serif}
body{touch-action:manipulation;color:#24313f}
.app{max-width:1050px;margin:0 auto;padding:6px}
.note{background:#fff;padding:10px 12px;border-radius:11px;margin-bottom:7px;font-size:14px;box-shadow:0 1px 5px rgba(0,0,0,.08)}
.page-label{font-weight:900;margin:14px 0 5px 2px}
.wrap{position:relative;background:#fff;width:100%;margin:0 0 12px 0}
.sheet{display:block;width:100%;height:auto;pointer-events:none;user-select:none;-webkit-user-drag:none}
.zone{position:absolute;z-index:5;margin:0;padding:0;border:2px solid transparent;border-radius:8px;background:transparent;appearance:none;-webkit-appearance:none;display:flex;align-items:center;justify-content:center;touch-action:manipulation;cursor:pointer}
.zone.active{background:rgba(47,170,83,.25);border-color:#2faa53}
.zone.filled{background:rgba(47,170,83,.10);border-color:#79b98c}
.zone span{font-size:clamp(40px,6.2vw,86px);font-weight:900;color:#444;line-height:1;letter-spacing:-1px;pointer-events:none;white-space:nowrap}
.overlay{position:absolute;z-index:40;display:none;background:transparent;pointer-events:none}
.overlay.show{display:block}
.panel{width:100%;height:100%;background:rgb(47,170,83);border:2px solid #258945;border-radius:22px;padding:10px;box-shadow:0 8px 26px rgba(0,0,0,.24);pointer-events:auto;display:flex;flex-direction:column;overflow:hidden}
.head{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-bottom:8px;flex:0 0 auto}
.preview{min-width:76px;min-height:38px;padding:4px 8px;display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.8);border-radius:11px;background:#fff;font-size:25px;font-weight:900;color:#34495e}
.close-pad{width:30px;height:30px;min-width:30px;border:0;border-radius:50%;background:#fff;color:#216b38;font-size:21px;font-weight:900;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;flex:1;min-height:0}
.keys button{min-height:0;border:1px solid rgba(0,0,0,.18);border-radius:11px;background:#fff;color:#24313f;font-size:clamp(22px,3.6vw,40px);font-weight:900;cursor:pointer;touch-action:manipulation;display:flex;align-items:center;justify-content:center;padding:0;line-height:1;text-align:center}
.keys .op{background:#edf5ff;color:#245fa6}
.keys .erase{background:#ffe3e3;color:#a51f1f;border-color:#e0a6a6}
.keys button:active{transform:scale(.97)}
.zero{grid-column:2 / span 2}
.status{position:sticky;bottom:5px;z-index:20;margin-top:6px;background:#fff;padding:9px 11px;border-radius:9px;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.10)}
.home-link{position:fixed;left:10px;bottom:10px;z-index:70;text-decoration:none;background:#fff;color:#263746;border-radius:12px;padding:9px 12px;font-weight:900;font-size:14px;box-shadow:0 3px 12px rgba(0,0,0,.18)}
.mini{position:fixed;right:12px;bottom:12px;z-index:60;width:58px;height:58px;border:0;border-radius:14px;background:#263746;color:#fff;font-size:27px;font-weight:900;box-shadow:0 4px 16px rgba(0,0,0,.25);cursor:pointer}
@media(max-width:720px){.panel{padding:6px;border-radius:15px}.keys{gap:4px}.keys button{font-size:21px;border-radius:8px}.preview{min-width:55px;min-height:29px;font-size:18px}.close-pad{width:25px;height:25px;min-width:25px;font-size:17px}.note{font-size:12px}}
</style></head><body><a href="../index.html" class="home-link">🏠 Accueil</a><div class="app"><div class="note"><b>N7 - 3</b> — 2 pages. Le premier exemple « +3 » reste inactif. Les 15 autres cases attendent : + puis un chiffre.</div><div class="page-label">Page 1</div><div class="wrap"><img class="sheet" src="../images/N7-3a.jpg" alt="N7 exercice 3 page 1"><button class="zone" type="button" data-mode="plusdigit" data-pad-left="14.0" data-pad-top="20.0" data-pad-width="31.0" data-pad-height="19.0" style="left:70.8024%;top:29.3945%;width:10.5192%;height:4.6875%"><span></span></button><button class="zone" type="button" data-mode="plusdigit" data-pad-left="55.0" data-pad-top="41.0" data-pad-width="31.0" data-pad-height="19.0" style="left:25.0843%;top:50.6836%;width:10.5192%;height:4.6875%"><span></span></button><button class="zone" type="button" data-mode="plusdigit" data-pad-left="14.0" data-pad-top="41.0" data-pad-width="31.0" data-pad-height="19.0" style="left:71.6116%;top:50.6836%;width:10.5192%;height:4.6875%"><span></span></button><button class="zone" type="button" data-mode="plusdigit" data-pad-left="55.0" data-pad-top="62.0" data-pad-width="31.0" data-pad-height="19.0" style="left:25.0843%;top:71.8262%;width:10.5192%;height:4.6875%"><span></span></button><button class="zone" type="button" data-mode="plusdigit" data-pad-left="14.0" data-pad-top="62.0" data-pad-width="31.0" data-pad-height="19.0" style="left:71.4767%;top:71.8262%;width:10.5192%;height:4.6875%"><span></span></button><button class="zone" type="button" data-mode="plusdigit" data-pad-left="55.0" data-pad-top="79.5" data-pad-width="31.0" data-pad-height="19.0" style="left:24.9494%;top:92.4805%;width:10.5866%;height:4.7363%"><span></span></button><button class="zone" type="button" data-mode="plusdigit" data-pad-left="14.0" data-pad-top="79.5" data-pad-width="31.0" data-pad-height="19.0" style="left:71.6116%;top:92.4805%;width:10.5192%;height:4.7363%"><span></span></button></div><div class="page-label">Page 2</div><div class="wrap"><img class="sheet" src="../images/N7-3b.jpg" alt="N7 exercice 3 page 2"><button class="zone" type="button" data-mode="plusdigit" data-pad-left="55.0" data-pad-top="7.0" data-pad-width="31.0" data-pad-height="19.0" style="left:21.7802%;top:17.2363%;width:10.2495%;height:4.5898%"><span></span></button><button class="zone" type="button" data-mode="plusdigit" data-pad-left="14.0" data-pad-top="7.0" data-pad-width="31.0" data-pad-height="19.0" style="left:72.0162%;top:17.3828%;width:10.2495%;height:4.5898%"><span></span></button><button class="zone" type="button" data-mode="plusdigit" data-pad-left="55.0" data-pad-top="30.0" data-pad-width="31.0" data-pad-height="19.0" style="left:22.2522%;top:40.5273%;width:10.2495%;height:4.5898%"><span></span></button><button class="zone" type="button" data-mode="plusdigit" data-pad-left="14.0" data-pad-top="30.0" data-pad-width="31.0" data-pad-height="19.0" style="left:72.6231%;top:40.0391%;width:10.2495%;height:4.6387%"><span></span></button><button class="zone" type="button" data-mode="plusdigit" data-pad-left="55.0" data-pad-top="54.5" data-pad-width="31.0" data-pad-height="19.0" style="left:22.6568%;top:65.9180%;width:10.3169%;height:4.6387%"><span></span></button><button class="zone" type="button" data-mode="plusdigit" data-pad-left="14.0" data-pad-top="54.5" data-pad-width="31.0" data-pad-height="19.0" style="left:72.6231%;top:64.7949%;width:10.3169%;height:4.6387%"><span></span></button><button class="zone" type="button" data-mode="plusdigit" data-pad-left="55.0" data-pad-top="79.0" data-pad-width="31.0" data-pad-height="19.0" style="left:22.6568%;top:91.1621%;width:10.3169%;height:4.6387%"><span></span></button><button class="zone" type="button" data-mode="plusdigit" data-pad-left="14.0" data-pad-top="79.0" data-pad-width="31.0" data-pad-height="19.0" style="left:72.6231%;top:90.5762%;width:10.2495%;height:4.5898%"><span></span></button></div><div id="status" class="status">Touchez une case blanche. Entrez + puis un chiffre.</div></div><button id="mini" class="mini" type="button">🔢</button><div id="overlay" class="overlay"><div class="panel"><div class="head"><div id="preview" class="preview">—</div><button id="btnClosePad" class="close-pad" type="button">×</button></div><div class="keys"><button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button class="op" data-k="+">+</button><button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button class="erase" data-k="ERASE">⌫</button><button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button class="zero" data-k="0">0</button></div></div></div><script>
(() => {
  const zones=[...document.querySelectorAll('.zone')], overlay=document.getElementById('overlay'), mini=document.getElementById('mini'), preview=document.getElementById('preview'), status=document.getElementById('status');
  let active=null, entry='';
  function refresh(){preview.textContent=entry||'—'}
  function place(z){const wrap=z.closest('.wrap');wrap.appendChild(overlay);overlay.style.left=z.dataset.padLeft+'%';overlay.style.top=z.dataset.padTop+'%';overlay.style.width=z.dataset.padWidth+'%';overlay.style.height=z.dataset.padHeight+'%'}
  function openPad(z){active=z;zones.forEach(x=>x.classList.toggle('active',x===z));entry='';refresh();place(z);overlay.classList.add('show');mini.style.display='none';status.textContent='Choisis d’abord +.'}
  function closePad(){overlay.classList.remove('show');mini.style.display='block';if(active)active.classList.remove('active')}
  function save(v){active.querySelector('span').textContent=v;active.classList.add('filled');status.textContent='✓ Réponse enregistrée : '+v;entry='';refresh();closePad()}
  zones.forEach(z=>z.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();openPad(z)}));
  document.querySelectorAll('[data-k]').forEach(btn=>btn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();if(!active)return;const k=btn.dataset.k;if(k==='ERASE'){active.querySelector('span').textContent='';active.classList.remove('filled');entry='';refresh();status.textContent='Réponse effacée.';closePad();return}if(entry.length===0){if(k!=='+'){status.textContent='Commence par choisir +.';return}entry='+';refresh();status.textContent='Choisis maintenant un chiffre.';return}if(entry==='+'){if(!/^\d$/.test(k)){status.textContent='Choisis un chiffre après +.';return}entry+=k;refresh();save(entry);return}}));
  mini.addEventListener('click',()=>{if(active)openPad(active);else status.textContent='Touchez d’abord une case blanche.'});
  document.getElementById('btnClosePad').addEventListener('click',()=>{entry='';refresh();closePad();status.textContent='Pavé fermé.'});
})();
</script></body></html>
