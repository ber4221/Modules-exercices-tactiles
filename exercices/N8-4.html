<style>
*{box-sizing:border-box}
html,body{margin:0;background:#eef2f5;font-family:Arial,sans-serif}
body{touch-action:manipulation}
.app{max-width:980px;margin:0 auto;padding:4px}
.note{
  background:#fff;padding:8px 10px;border-radius:10px;margin-bottom:5px;
  font-size:13px;box-shadow:0 1px 5px rgba(0,0,0,.08)
}
.wrap{position:relative;background:#fff;width:100%}
.sheet{display:block;width:100%;height:auto;pointer-events:none;user-select:none;-webkit-user-drag:none}

.zone{
  position:absolute;z-index:5;margin:0;padding:0;
  border:2px solid transparent;border-radius:7px;
  background:transparent;appearance:none;-webkit-appearance:none;
  display:flex;align-items:center;justify-content:center;
  touch-action:manipulation;cursor:pointer
}
.zone.active{background:rgba(47,170,83,.25);border-color:#2faa53}
.zone.filled{background:rgba(47,170,83,.10);border-color:#79b98c}
.zone span{
  font-size:clamp(30px,5.8vw,72px);
  font-weight:900;color:#444;line-height:1;
  pointer-events:none
}

.mini{
  position:fixed;right:12px;bottom:12px;z-index:60;
  width:56px;height:56px;border:0;border-radius:14px;
  background:#263746;color:#fff;font-size:26px;font-weight:900;
  box-shadow:0 4px 16px rgba(0,0,0,.25);cursor:pointer
}

.overlay{
  position:absolute;
  z-index:40;
  display:none;
  width:44%;
  height:auto !important;
  background:transparent;
  pointer-events:none
}
.overlay.show{display:block}
.panel{
  width:100%;
  height:auto !important;
  min-height:0 !important;
  background:rgb(47,170,83);
  border:2px solid #258945;
  border-radius:24px;
  padding:16px;
  box-shadow:0 8px 26px rgba(0,0,0,.20);
  pointer-events:auto;
  display:block;
  overflow:visible;
}
.head{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:8px;
  margin-bottom:12px;
  flex:0 0 auto
}
.preview{
  min-width:78px;min-height:48px;padding:6px 10px;
  display:flex;align-items:center;justify-content:center;
  border:2px solid rgba(255,255,255,.75);border-radius:13px;
  background:#fff;font-size:31px;font-weight:900;color:#34495e
}
.close-pad{
  width:34px;height:34px;min-width:34px;border:0;border-radius:50%;
  background:#fff;color:#216b38;font-size:25px;font-weight:900;
  line-height:1;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,.18);cursor:pointer;touch-action:manipulation
}
.keys{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:11px;
  width:100%;
}
.keys button{
  min-height:76px;
  border:1px solid rgba(0,0,0,.18);
  border-radius:16px;
  background:#fff;
  color:#24313f;
  font-size:35px;
  font-weight:900;
  cursor:pointer;
  touch-action:manipulation
}
.keys .op{background:#edf5ff;color:#245fa6}
.keys .clear{background:#fff0f0;color:#b33434}
.keys .erase{background:#ffe3e3;color:#a51f1f;border-color:#e0a6a6}
.keys button:active{transform:scale(.97)}

.status{
  position:sticky;bottom:5px;z-index:20;margin-top:6px;
  background:#fff;padding:8px 10px;border-radius:9px;font-size:13px;
  box-shadow:0 2px 8px rgba(0,0,0,.10)
}
.home-link{
  position:fixed;left:10px;bottom:10px;z-index:70;
  text-decoration:none;background:#fff;color:#263746;
  border-radius:12px;padding:9px 12px;font-weight:900;font-size:14px;
  box-shadow:0 3px 12px rgba(0,0,0,.18)
}

@media(max-width:650px){
  .panel{padding:9px;border-radius:17px}
  .keys{gap:6px}
  .keys button{min-height:56px;font-size:28px;border-radius:12px}
  .preview{min-width:58px;min-height:40px;font-size:25px}
  .close-pad{width:30px;height:30px;min-width:30px;font-size:22px}
}
</style>

  <div id="status" class="status">Touchez une case blanche.</div>
</div>

<button id="mini" class="mini" type="button" aria-label="Ouvrir le pavé">🔢</button>

<div id="overlay" class="overlay">
  <div class="panel">
    <div class="head">
      <div id="preview" class="preview">—</div>
      <button id="btnClosePad" class="close-pad" type="button" aria-label="Réduire le pavé">×</button>
    </div>

    <div class="keys">
      <button data-k="1">1</button>
      <button data-k="2">2</button>
      <button data-k="3">3</button>
      <button class="op" data-k="+">+</button>

      <button data-k="4">4</button>
      <button data-k="5">5</button>
      <button data-k="6">6</button>
      <button class="op" data-k="-">−</button>

      <button data-k="7">7</button>
      <button data-k="8">8</button>
      <button data-k="9">9</button>
      <button class="clear" data-k="C">C</button>

      <button class="erase" data-k="ERASE" title="Effacer la réponse">⌫</button><button data-k="0" style="grid-column:2 / span 2">0</button>
    </div>
  </div>
</div>

<script>
(() => {
  const zones=[...document.querySelectorAll('.zone')];
  const overlay=document.getElementById('overlay');
  const mini=document.getElementById('mini');
  const preview=document.getElementById('preview');
  const status=document.getElementById('status');
  const sheetWrap=document.getElementById('sheetWrap');

  sheetWrap.appendChild(overlay);

  let active=null;
  let entry='';

  // Limites verticales des 4 exercices/rangées,
  // calculées sur la fiche réelle pour que le pavé soit bien aligné.
  const rows=[
    [0.169,0.351],
    [0.379,0.562],
    [0.588,0.771],
    [0.798,0.982]
  ];

  function refresh(){
    preview.textContent=entry ? entry.replace('-', '−') : '—';
  }

  function positionKeypad(z){
    const wrapW=sheetWrap.clientWidth;
    const wrapH=sheetWrap.clientHeight;
    const zr=z.getBoundingClientRect();
    const wr=sheetWrap.getBoundingClientRect();

    const cx=(zr.left-wr.left)+(zr.width/2);
    const cy=(zr.top-wr.top)+(zr.height/2);

    // Colonne opposée :
    // exercice gauche -> pavé sur l'exercice droit
    // exercice droit  -> pavé sur l'exercice gauche
    const isLeft=cx < wrapW/2;
    const padW=wrapW*0.44;
    const sideMargin=wrapW*0.035;
    const left=isLeft ? wrapW-padW-sideMargin : sideMargin;

    const yRatio=cy/wrapH;
    let rowIndex=0;
    if(yRatio>=rows[3][0]) rowIndex=3;
    else if(yRatio>=rows[2][0]) rowIndex=2;
    else if(yRatio>=rows[1][0]) rowIndex=1;

    const row=rows[rowIndex];

    // Alignement vertical : le haut du pavé suit exactement
    // le haut de l'exercice de la même rangée.
    const top=wrapH*row[0];
    overlay.style.left=left+'px';
    overlay.style.top=top+'px';
    overlay.style.height='auto';
  }

  function openPad(z){
    if(z) active=z;
    if(!active){
      status.textContent='Touchez d’abord une case.';
      return;
    }

    zones.forEach(x=>x.classList.toggle('active',x===active));

    entry='';
    refresh();

    const mode=active.dataset.mode;

    if(mode==='signed'){
      status.textContent='Choisis d’abord + ou −, puis le chiffre.';
    }else{
      status.textContent='Choisis le chiffre.';
    }

    positionKeypad(active);
    overlay.classList.add('show');
    mini.style.display='none';
  }

  function closePad(){
    overlay.classList.remove('show');
    mini.style.display='block';
  }

  function saveAndClose(value){
    if(!active) return;

    active.dataset.value=value;
    active.querySelector('span').textContent=value.replace('-', '−');
    active.classList.remove('active');
    active.classList.add('filled');

    status.textContent='✓ Réponse enregistrée : '+value.replace('-', '−');

    entry='';
    refresh();
    closePad();
  }

  zones.forEach(z=>{
    z.addEventListener('pointerup',e=>{
      e.preventDefault();
      e.stopPropagation();
      openPad(z);
    });
  });

  document.querySelectorAll('[data-k]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(!active) return;

      const k=btn.dataset.k;
      const mode=active.dataset.mode;

      if(k==='ERASE'){
        active.dataset.value='';
        active.querySelector('span').textContent='';
        active.classList.remove('filled','active');
        entry='';
        refresh();
        status.textContent='Réponse effacée.';
        closePad();
        return;
      }

      if(k==='C'){
        entry='';
        refresh();
        status.textContent=mode==='signed'
          ? 'Choisis d’abord + ou −, puis le chiffre.'
          : 'Choisis le chiffre.';
        return;
      }

      if(k==='+' || k==='-'){
        if(mode!=='signed'){
          status.textContent='Cette petite case attend uniquement un chiffre.';
          return;
        }

        entry=k;
        refresh();
        status.textContent='Maintenant, choisis le chiffre.';
        return;
      }

      // Ici k est un chiffre.
      if(mode==='number'){
        saveAndClose(k);
        return;
      }

      if(mode==='signed'){
        if(!/^[+-]$/.test(entry)){
          status.textContent='Choisis d’abord + ou −.';
          return;
        }
        saveAndClose(entry+k);
      }
    });
  });

  mini.addEventListener('click',()=>openPad(active));

  document.getElementById('btnClosePad').addEventListener('click',()=>{
    if(active) active.classList.remove('active');
    closePad();
    status.textContent='Pavé réduit. Touchez une case pour le rouvrir.';
  });

  window.addEventListener('resize',()=>{
    if(active && overlay.classList.contains('show')) positionKeypad(active);
  });
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('../service-worker.js')
      .catch(err => console.error('Service Worker:', err));
  });
}
</script>
