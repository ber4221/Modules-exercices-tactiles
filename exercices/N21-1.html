<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>N21 - 1</title><style>
*{box-sizing:border-box}
html,body{margin:0;background:#eef2f5;font-family:Arial,sans-serif}
body{touch-action:manipulation;color:#24313f}
.app{max-width:1050px;margin:0 auto;padding:6px}
.note{background:#fff;padding:10px 12px;border-radius:11px;margin-bottom:7px;font-size:14px;box-shadow:0 1px 5px rgba(0,0,0,.08)}
.page-label{font-weight:900;margin:14px 0 5px 2px}
.wrap{position:relative;background:#fff;width:100%;margin:0 0 12px 0}
.sheet{display:block;width:100%;height:auto;pointer-events:none;user-select:none;-webkit-user-drag:none}
.zone{position:absolute;z-index:5;margin:0;padding:0;border:2px solid transparent;border-radius:8px;background:transparent;appearance:none;-webkit-appearance:none;display:flex;align-items:center;justify-content:center;touch-action:manipulation;cursor:pointer}
.zone.active{background:rgba(47,170,83,.25);border-color:#2faa53}
.zone.filled{background:rgba(47,170,83,.10);border-color:#79b98c}
.zone span{font-size:clamp(34px,5.4vw,72px);font-weight:900;color:#444;line-height:1;letter-spacing:-1px;pointer-events:none;white-space:nowrap}
.overlay{position:absolute;z-index:40;display:none;background:transparent;pointer-events:none}
.overlay.show{display:block}
.panel{width:100%;height:100%;background:rgb(47,170,83);border:2px solid #258945;border-radius:22px;padding:12px;box-shadow:0 8px 26px rgba(0,0,0,.24);pointer-events:auto;display:flex;flex-direction:column;overflow:hidden}
.head{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-bottom:8px;flex:0 0 auto}
.preview{min-width:82px;min-height:42px;padding:4px 8px;display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.8);border-radius:11px;background:#fff;font-size:27px;font-weight:900;color:#34495e}
.close-pad{width:32px;height:32px;min-width:32px;border:0;border-radius:50%;background:#fff;color:#216b38;font-size:23px;font-weight:900;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.18);cursor:pointer;touch-action:manipulation}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;flex:1;align-content:stretch;min-height:0}
.keys button{min-height:0;border:1px solid rgba(0,0,0,.18);border-radius:12px;background:#fff;color:#24313f;font-size:clamp(22px,3.5vw,38px);font-weight:900;cursor:pointer;touch-action:manipulation;display:flex;align-items:center;justify-content:center;padding:0;line-height:1}
.keys .op{background:#edf5ff;color:#245fa6}
.keys .erase{background:#ffe3e3;color:#a51f1f;border-color:#e0a6a6}
.keys button:active{transform:scale(.97)}
.zero{grid-column:2 / span 2}
.status{position:sticky;bottom:5px;z-index:20;margin-top:6px;background:#fff;padding:9px 11px;border-radius:9px;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.10)}
.home-link{position:fixed;left:10px;bottom:10px;z-index:70;text-decoration:none;background:#fff;color:#263746;border-radius:12px;padding:9px 12px;font-weight:900;font-size:14px;box-shadow:0 3px 12px rgba(0,0,0,.18)}
.mini{position:fixed;right:12px;bottom:12px;z-index:60;width:58px;height:58px;border:0;border-radius:14px;background:#263746;color:#fff;font-size:27px;font-weight:900;box-shadow:0 4px 16px rgba(0,0,0,.25);cursor:pointer}
@media(max-width:720px){.panel{padding:7px;border-radius:16px}.keys{gap:4px}.keys button{font-size:22px;border-radius:8px}.preview{min-width:58px;min-height:32px;font-size:19px}.close-pad{width:26px;height:26px;min-width:26px;font-size:18px}.note{font-size:12px}}
</style></head><body><a href="../index.html" class="home-link">🏠 Accueil</a><div class="app"><div class="note"><b>N21 - 1</b> — 2 pages consécutives. Un seul chiffre par case. L’exemple 5 − 2 de la première page reste inactif.</div><div class="page-label">Page 1</div><div class="wrap"><img class="sheet" src="../images/N21-1a.jpg"><button class="zone" type="button" data-mode="number" style="left:41.27%;top:62.79%;width:7.69%;height:5.03%"><span></span></button><button class="zone" type="button" data-mode="number" style="left:41.47%;top:87.60%;width:7.69%;height:5.08%"><span></span></button></div><div class="page-label">Page 2</div><div class="wrap"><img class="sheet" src="../images/N21-1b.jpg"><button class="zone" type="button" data-mode="number" style="left:39.45%;top:22.41%;width:7.22%;height:4.74%"><span></span></button><button class="zone" type="button" data-mode="number" style="left:39.65%;top:45.70%;width:7.22%;height:4.74%"><span></span></button><button class="zone" type="button" data-mode="number" style="left:40.32%;top:68.46%;width:7.22%;height:4.74%"><span></span></button><button class="zone" type="button" data-mode="number" style="left:40.53%;top:91.75%;width:7.22%;height:4.74%"><span></span></button></div><div id="status" class="status">Touchez une case blanche. Le pavé apparaît juste sous la case de réponse. Pour le dernier exercice, il apparaît au-dessus du dessin avec les poissons.</div></div><button id="mini" class="mini" type="button" aria-label="Ouvrir le pavé">🔢</button><div id="overlay" class="overlay"><div class="panel"><div class="head"><div id="preview" class="preview">—</div><button id="btnClosePad" class="close-pad" type="button" aria-label="Réduire le pavé">×</button></div><div class="keys"><button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button class="op" data-k="+">+</button><button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button class="op" data-k="-">−</button><button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button class="erase" data-k="ERASE" title="Effacer la réponse">⌫</button><button class="zero" data-k="0">0</button></div></div></div><script>
(() => {
  const zones=[...document.querySelectorAll('.zone')];
  const overlay=document.getElementById('overlay');
  const mini=document.getElementById('mini');
  const preview=document.getElementById('preview');
  const status=document.getElementById('status');
  let active=null, entry='';
  function shown(v){return (v||'').replace('-', '−')}
  function refresh(){preview.textContent=entry ? shown(entry) : '—'}
  function place(z){
    const wrap=z.closest('.wrap');
    const wr=wrap.getBoundingClientRect();
    const zr=z.getBoundingClientRect();
    const padW=wr.width*0.38;
    const padH=wr.height*0.18;

    // Le pavé est positionné par rapport au document, pas à l'image :
    // il reste exactement sous la case de réponse même si celle-ci est proche du bas.
    document.body.appendChild(overlay);
    overlay.style.width=padW+'px';
    overlay.style.height=padH+'px';

    let left=zr.left + zr.width/2 - padW/2 + window.scrollX;
    const minLeft=wr.left + 8 + window.scrollX;
    const maxLeft=wr.right - padW - 8 + window.scrollX;
    left=Math.max(minLeft, Math.min(left, maxLeft));

    let top;
    const isLast=(z===zones[zones.length-1]);
    if(isLast){
      // Dernier exercice : le pavé se place dans l'espace AU-DESSUS du dessin des poissons.
      top=wr.top + wr.height*0.585 + window.scrollY;
    }else{
      // Tous les autres : directement SOUS la case de réponse.
      top=zr.bottom + 8 + window.scrollY;
    }

    overlay.style.left=left+'px';
    overlay.style.top=top+'px';
  }
  function openPad(z){
    if(z) active=z;
    if(!active){status.textContent='Touchez d’abord une case blanche.';return}
    zones.forEach(x=>x.classList.toggle('active',x===active));
    entry=''; refresh(); place(active); overlay.classList.add('show'); mini.style.display='none';
    status.textContent=active.dataset.mode==='number' ? 'Choisis un chiffre.' : 'Choisis d’abord un chiffre.';
  }
  function closePad(){overlay.classList.remove('show');mini.style.display='block'}
  function saveAndClose(value){
    active.dataset.value=value; active.querySelector('span').textContent=shown(value);
    active.classList.remove('active'); active.classList.add('filled');
    status.textContent='✓ Réponse enregistrée : '+shown(value); entry=''; refresh(); closePad();
  }
  zones.forEach(z=>z.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();openPad(z)}));
  document.querySelectorAll('[data-k]').forEach(btn=>btn.addEventListener('click',()=>{
    if(!active)return;
    const k=btn.dataset.k, mode=active.dataset.mode;
    if(k==='ERASE'){
      active.dataset.value='';active.querySelector('span').textContent='';active.classList.remove('filled','active');entry='';refresh();status.textContent='Réponse effacée.';closePad();return;
    }
    const isDigit=/^\d$/.test(k), isSign=(k==='+'||k==='-');
    if(mode==='number'){
      if(!isDigit){status.textContent='Cette case attend uniquement un chiffre.';return}
      saveAndClose(k);return;
    }
    if(entry.length===0){if(!isDigit){status.textContent='Commence par choisir un chiffre.';return}entry=k;refresh();status.textContent='Maintenant, choisis + ou −.';return}
    if(entry.length===1){if(!isSign){status.textContent='Après le premier chiffre, choisis + ou −.';return}entry+=k;refresh();status.textContent='Termine par un chiffre.';return}
    if(entry.length===2){if(!isDigit){status.textContent='Termine par un chiffre.';return}entry+=k;refresh();saveAndClose(entry);return}
  }));
  mini.addEventListener('click',()=>openPad(active));
  document.getElementById('btnClosePad').addEventListener('click',()=>{if(active)active.classList.remove('active');entry='';refresh();closePad();status.textContent='Pavé réduit. Touchez une case pour le rouvrir.'});
})();
</script></body></html>
